[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-scene-benchmark"
version = "0.1.0"
description = "Portable, query-only benchmark harness for CARLA and MetaDrive scene generators"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["jsonschema>=3,<5"]

[project.scripts]
bus-benchmark = "bus_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bus_benchmark = [
  "assets/schemas/*.json",
  "assets/query_lib/*.json",
  "assets/query_lib/*.jsonl",
  "assets/query_lib/*.txt",
  "assets/query_lib/*.py",
]
