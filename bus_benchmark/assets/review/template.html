<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"><title>场景要求审阅</title><style>@@STYLE@@</style></head><body>
<header><h1>场景要求审阅</h1><p>只核对当前原文。机器草稿和浏览器提交均不是正式 gold。</p><div id="identity"></div><p id="storage" role="status">正在检查本地存储与编辑锁…</p></header>
<nav><button id="export">导出进度备份</button><label class="file">恢复备份<input type="file" id="restore" accept=".json,application/json"></label><button id="help">一页指南</button><span id="progress"></span></nav>
<main><aside><label>题目队列<select id="filter"><option value="all">全部</option><option value="pending">待审阅</option><option value="issues">有疑问</option><option value="submitted">已提交</option></select></label><select id="queue" size="16" aria-label="题目队列"></select></aside>
<section><div class="query"><strong id="subject"></strong><p id="query"></p></div><p id="message" role="alert"></p><fieldset id="editor"><legend>核对草稿，仅修改异议</legend><div id="cards"></div><button id="add" type="button">新增要求</button><section id="support"></section><section id="cpd"></section><label>备注<textarea id="notes" rows="3" placeholder="必要的修订依据或说明"></textarea></label><div class="issues"><label>疑问原因<select id="issue"><option value="semantic_unclear">语义不清，需进一步核对</option><option value="source_error">原文或源材料有误</option><option value="expert_review">需要专家处理 CPD 或复杂修订</option><option value="other">其他（请写备注）</option></select></label><button id="defer" type="button">保留编辑，暂存并下一题</button><button id="resume" type="button">返回本题审阅</button><div id="issue-list"></div></div></fieldset>
<footer><button id="previous">上一题</button><button id="confirm" class="primary">我已核对全部可见要求，提交本题</button><button id="next">下一题</button><p>提交后仍可修改；修改会恢复待提交。备份文件须交由维护者校验，部分完成不能定稿整套。</p></footer></section></main>
<dialog id="guide"><button id="close-guide">关闭指南</button><pre id="guide-text"></pre><section id="practice"></section></dialog>
<script id="packet" type="application/json">@@PACKET@@</script><script>@@SCRIPT@@</script></body></html>
